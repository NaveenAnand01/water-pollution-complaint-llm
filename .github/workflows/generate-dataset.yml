name: Generate dataset
on:
  push:
    paths: ["data/generate_dataset.py", ".github/workflows/generate-dataset.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python data/generate_dataset.py
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/water_pollution_complaints.csv
          git diff --cached --quiet || (git commit -m "Generate AquaGrievance-TN dataset" && git push)
